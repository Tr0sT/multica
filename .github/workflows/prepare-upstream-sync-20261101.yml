name: Prepare upstream sync 2026-11-01 (temporary)
on:
  push:
    branches:
      - sync/upstream-2026-11-01
    paths:
      - .github/workflows/prepare-upstream-sync-20261101.yml
permissions:
  contents: write
jobs:
  merge-upstream:
    if: github.repository == 'Tr0sT/multica'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge exact upstream target with semantic conflict resolution
        env:
          TARGET_SHA: 5a2cc891ac338eed1919aa11a1eef5957cd82cec
          SOURCE_SHA: 98490111b365028681cff885eeb10c261ba27e05
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git config user.name "Multica Fork Sync"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/multica-ai/multica.git
          git fetch --no-tags upstream "$TARGET_SHA"
          git cat-file -t "$TARGET_SHA"
          echo "MERGE_BASE=$(git merge-base HEAD "$TARGET_SHA")"
          if ! git merge --no-ff --no-commit "$TARGET_SHA"; then
            python3 scripts/resolve-upstream-sync-20261101.py
          fi
          test -z "$(git ls-files -u)"
          git add -A
          git diff --cached --check
          for path in server/internal/integrations/mattermost/access.go server/cmd/multica/cmd_teambridge.go server/migrations/fork-prefix-allowlist.json docs/agent-marketplaces.md; do
            test -f "$path" || { echo "::error::Fork feature lost: $path"; exit 1; }
          done
          git commit -m "chore: merge upstream main at ${TARGET_SHA:0:12}"
          git merge-base --is-ancestor "$TARGET_SHA" HEAD
          git rm .github/workflows/prepare-upstream-sync-20261101.yml scripts/resolve-upstream-sync-20261101.py
          git commit -m "chore: remove temporary sync preparation files"
          git push origin HEAD:refs/heads/sync/upstream-2026-11-01
