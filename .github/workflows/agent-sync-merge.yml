name: Sync merge preparation (temporary)
on:
  push:
    branches:
      - sync/upstream-2026-11-21-03dfb8f
permissions:
  contents: write
jobs:
  prepare-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream with fork (three semantically reviewed conflict blocks)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "multica-sync"
          git config user.email "noreply@github.com"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "9a8bb3053eb0f06ace6a8ab6ec36ba768435c165"
          git merge --no-commit --no-ff origin/main || true
          echo "Unmerged files:"
          git diff --name-only --diff-filter=U
          test "$(git diff --name-only --diff-filter=U | wc -l)" -eq 3
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          pattern = re.compile(r"^<<<<<<< HEAD\n(.*?)^=======\n(.*?)^>>>>>>> origin/main\n", re.MULTILINE | re.DOTALL)
          
          def resolve(path, expected, transform):
              file = Path(path)
              text = file.read_text()
              matches = list(pattern.finditer(text))
              if len(matches) != expected:
                  raise RuntimeError(f"{path}: expected {expected} conflicts, found {len(matches)}")
              index = 0
              def replacement(match):
                  nonlocal index
                  index += 1
                  return transform(index, match.group(1), match.group(2))
              resolved = pattern.sub(replacement, text)
              if "<<<<<<<" in resolved or ">>>>>>>" in resolved:
                  raise RuntimeError(f"{path}: unresolved markers remain")
              file.write_text(resolved)
              print(f"Resolved {path}: {len(matches)} verified conflict(s)")
          
          def client_resolver(index, upstream, fork):
              assert index == 1 and "queue_when_busy" in upstream and "getAgentMarketplaceCatalog" in fork
              assert "setAgentPluginSelection" in fork and "disconnectAgentMarketplace" in fork
              return fork.rstrip("\n") + "\n\n" + upstream
          
          resolve("packages/core/api/client.ts", 1, client_resolver)
          
          def test_resolver(index, upstream, fork):
              assert index == 1 and "ApiError" in upstream
              assert 'import { api } from "@multica/core/api";' in fork
              return upstream
          
          resolve("packages/views/runtimes/components/update-section.test.tsx", 1, test_resolver)
          
          def daemon_resolver(index, upstream, fork):
              lines = fork.splitlines(keepends=True)
              assert len(lines) > 2
              assert "processHeartbeat" in upstream and "processHeartbeat" in lines[0]
              assert "SupportsBatchImport" in lines[0] or "supportsBatchImport" in lines[0]
              assert "PendingMarketplace" in fork and "claimAgentMarketplaceSync" in fork
              assert "processHeartbeat" in upstream and "req)" in upstream
              return upstream + "".join(lines[1:])
          
          resolve("server/internal/handler/daemon.go", 2, daemon_resolver)
          PY
          git add packages/core/api/client.ts packages/views/runtimes/components/update-section.test.tsx server/internal/handler/daemon.go
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git rm .github/workflows/agent-sync-merge.yml
          git commit -m "Merge fork main with upstream 03dfb8f (preserve local integrations)"
          git push origin HEAD:sync/upstream-2026-11-21-03dfb8f
