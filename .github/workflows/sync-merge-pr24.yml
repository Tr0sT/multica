name: Temporary upstream sync merge (PR 24)
on:
  push:
    branches: [sync/upstream-2026-11-17-71683141]
permissions:
  contents: write
jobs:
  merge-base-preserving:
    if: github.repository == 'Tr0sT/multica'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream and fork, preserving both features
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-ff --no-edit -m 'sync: combine upstream 71683141 with fork main' origin/main; then
            python3 <<'PY'
          import json
          import pathlib
          import re
          import subprocess

          expected = {
              "apps/docs/content/docs/channels.mdx": 3,
              **{f"apps/docs/content/docs/meta.{lang}.json": 1 for lang in ("ja", "ko", "zh")},
              "apps/docs/content/docs/meta.json": 1,
              "packages/views/settings/components/channel-connect-dialog.tsx": 2,
              "packages/views/settings/components/channel-disconnect-dialog.tsx": 1,
              "packages/views/settings/components/channels-tab.tsx": 1,
              "packages/views/settings/components/integration-channel-icon.tsx": 1,
              "packages/views/settings/components/messaging-channels.test.tsx": 4,
              "packages/views/settings/components/settings-navigation.ts": 1,
              "packages/views/settings/components/use-messaging-channels.ts": 3,
              "server/cmd/server/main.go": 1,
              "server/internal/daemon/client.go": 1,
              "server/internal/daemon/daemon.go": 1,
              "server/internal/daemon/execenv/channel_type.go": 2,
              "server/internal/handler/handler.go": 1,
          }
          conflicts = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=U"], text=True).splitlines()
          assert set(conflicts) == set(expected), f"Unexpected conflicts: {sorted(set(conflicts) ^ set(expected))}"
          pattern = re.compile(r"^<<<<<<< HEAD\n(.*?)^=======\n(.*?)^>>>>>>> origin/main\n", re.M | re.S)
          def both(a, b):
              return a + b
          def resolve(path, i, a, b):
              if path == "apps/docs/content/docs/channels.mdx":
                  if i == 0:
                      return a.replace("or WeChat and use them", "WeChat, or Mattermost and use them")
                  if i == 1:
                      return a.replace("and WeChat are available", "WeChat, and Mattermost are available")
                  return both(a, b)
              if path.startswith("apps/docs/content/docs/meta"):
                  return both(a, b)
              if path.endswith("/channel-connect-dialog.tsx"):
                  if i == 0: return both(a, b)
                  assert '"weixin"' in a and '"mattermost"' in b
                  return '  channel: Exclude<ChannelIntegration, "lark" | "weixin" | "mattermost">;\n'
              if path.endswith("/channel-disconnect-dialog.tsx"):
                  return both(a, b)
              if path.endswith("/channels-tab.tsx"):
                  return a.rstrip("\n") + ',{" "}\n' + b
              if path.endswith("/integration-channel-icon.tsx"):
                  return a.replace('"weixin";', '"weixin" | "mattermost";')
              if path.endswith("/messaging-channels.test.tsx"):
                  if i in (0, 1, 3): return both(a, b)
                  assert '"weixin"]' in a and '"mattermost"]' in b
                  return a.replace('"weixin"]', '"weixin", "mattermost"]')
              if path.endswith("/settings-navigation.ts"):
                  return both(a, b)
              if path.endswith("/use-messaging-channels.ts"):
                  if i == 0: return both(a, b)
                  if i == 1: return a.rstrip("\n").removesuffix(";") + "\n" + b
                  assert "const weixin = " in a and "const mattermost = " in b
                  return (a.splitlines(keepends=True)[0] + b.splitlines(keepends=True)[0] +
                      "  const queries = { lark, slack, dingtalk, wecom, telegram, weixin, mattermost };\n")
              if path == "server/cmd/server/main.go":
                  assert "go h.WeixinInstall.RunCleanup(sweepCtx)" in a
                  return a + "\t}\n" + b
              if path == "server/internal/daemon/client.go":
                  return both(a, b)
              if path == "server/internal/daemon/daemon.go":
                  last = a.splitlines(keepends=True)[-1]
                  assert "executeAndDrain" in last and "executeWithModelCapacityRetry" in b
                  return "".join(a.splitlines(keepends=True)[:-1]) + b
              if path == "server/internal/daemon/execenv/channel_type.go":
                  if i == 0:
                      assert "ChannelTypeMattermost" in b and "ChannelTypeWeixin" in a
                      return b.replace('ChannelTypeMattermost = "mattermost"', 'ChannelTypeMattermost = "mattermost"\n\tChannelTypeWeixin   = "weixin"')
                  assert "ChannelTypeWeixin:" in a
                  return a.replace("ChannelTypeWeixin:", "ChannelTypeWeixin, ChannelTypeMattermost:")
              if path == "server/internal/handler/handler.go":
                  return both(a, b)
              raise RuntimeError(f"Unknown resolution {path} #{i}")
          for path in conflicts:
              p = pathlib.Path(path)
              data = p.read_text()
              found = list(pattern.finditer(data))
              assert len(found) == expected[path], f"Unexpected number of conflict hunks in {path}: {len(found)}"
              index = 0
              def replace(m):
                  global index
                  i = index
                  index += 1
                  return resolve(path, i, m.group(1), m.group(2))
              data = pattern.sub(replace, data)
              assert not re.search(r"^(<<<<<<<|=======|>>>>>>>)", data, re.M), path
              if path.startswith("apps/docs/content/docs/meta"):
                  json.loads(data)
              p.write_text(data)
              print("Semantically resolved", path, "hunks", len(found))
          PY
            git add --all
            git diff --cached --check
            test -z "$(git diff --name-only --diff-filter=U)"
            git commit -m 'sync: resolve upstream Weixin and fork Mattermost integration'
          fi
          git rm .github/workflows/sync-merge-pr24.yml
          git commit -m 'chore(sync): remove temporary merge runner'
          python3 <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request

          repo = "Tr0sT/multica"
          upstream = "71683141a764ed3b1620db4bc26a2d0a098f135c"
          fork = "744eef805609232f7a6484ad77dc3c5b16a8066c"
          branch_before = "46b6738bebb73909db17ffae0e605cb2be3b5a5e"
          def git(*args):
              return subprocess.check_output(["git", *args])
          assert not git("ls-files", ".github/workflows/sync-merge-pr24.yml").strip()
          assert subprocess.run(["git", "merge-base", "--is-ancestor", upstream, "HEAD"]).returncode == 0
          assert subprocess.run(["git", "merge-base", "--is-ancestor", fork, "HEAD"]).returncode == 0
          def manifest(ref):
              raw = git("ls-tree", "-rz", ref)
              result = {}
              for record in raw.split(b"\0"):
                  if not record: continue
                  meta, rawpath = record.split(b"\t", 1)
                  mode, typ, sha = meta.decode().split()
                  result[rawpath.decode()] = {"mode": mode, "type": typ, "sha": sha}
              return result
          upstream_map = manifest(upstream)
          fork_map = manifest(fork)
          merged = manifest("HEAD")
          known = {x["sha"] for x in upstream_map.values()} | {x["sha"] for x in fork_map.values()}
          token = os.environ["GITHUB_TOKEN"]
          def api(endpoint, payload):
              body = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{endpoint}",
                  data=body, method="POST",
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=40) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as exc:
                  print("GitHub API failed at", endpoint, exc.code, exc.read().decode()[:2000])
                  raise
          changes = []
          uploaded = 0
          for path in sorted(set(upstream_map) | set(merged)):
              old = upstream_map.get(path)
              new = merged.get(path)
              if old == new: continue
              if new is None:
                  changes.append({"path": path, "mode": old["mode"], "type": old["type"], "sha": None})
                  continue
              sha = new["sha"]
              if sha not in known and new["type"] == "blob":
                  blob = git("cat-file", "blob", sha)
                  stored = api("/git/blobs", {"encoding": "base64", "content": base64.b64encode(blob).decode("ascii")})
                  assert stored["sha"] == sha, f"Blob SHA mismatch: {path}"
                  known.add(sha)
                  uploaded += 1
              changes.append({"path": path, "mode": new["mode"], "type": new["type"], "sha": sha})
          print("sync tree changed files:", len(changes), "uploaded merged blobs:", uploaded)
          base_tree = git("rev-parse", upstream + "^{tree}").decode().strip()
          resulting = api("/git/trees", {"base_tree": base_tree, "tree": changes})["sha"]
          local_tree = git("rev-parse", "HEAD^{tree}").decode().strip()
          assert resulting == local_tree, f"Tree mismatch: remote={resulting} local={local_tree}"
          remote_commit = api("/git/commits", {
              "message": "sync: preserve upstream and fork integration changes (Weixin + Mattermost)",
              "tree": resulting,
              "parents": [branch_before, fork],
          })["sha"]
          print("REMOTE_MERGE_SHA=" + remote_commit)
          print("REMOTE_MERGE_TREE=" + resulting)
          PY
