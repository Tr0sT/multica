name: NixOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - flake.*
      - nix/**
      - server/**
      - apps/web/**
      - apps/mobile/patches/**
      - packages/**
      - package.json
      - pnpm-*.yaml
      - .github/workflows/nix.yml
  push:
    branches: [main]
    paths:
      - flake.*
      - nix/**
      - server/**
      - apps/web/**
      - apps/mobile/patches/**
      - packages/**
      - package.json
      - pnpm-*.yaml
      - .github/workflows/nix.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs
