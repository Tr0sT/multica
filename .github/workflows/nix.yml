name: NixOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - flake.*
      - nix/**
      - server/**
      - apps/web/**
      - apps/mobile/patches/**
      - packages/**
      - package.json
      - pnpm-*.yaml
      - .github/workflows/nix.yml
  push:
    branches: [main]
    paths:
      - flake.*
      - nix/**
      - server/**
      - apps/web/**
      - apps/mobile/patches/**
      - packages/**
      - package.json
      - pnpm-*.yaml
      - .github/workflows/nix.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Configure binary cache
        uses: cachix/cachix-action@v15
        with:
          name: nuclearband
          skipPush: true
      - run: nix flake check --print-build-logs
      - name: Publish packages to Cachix
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        shell: bash
        run: |
          nix build --no-link --print-out-paths \
            .#multica-cli .#multica-server .#multica-web | cachix push nuclearband
