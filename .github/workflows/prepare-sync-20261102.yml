name: Prepare pinned upstream sync
on:
  push:
    branches: ['sync/upstream-2026-11-02-84a15b5']
    paths: ['.github/workflows/prepare-sync-20261102.yml']
permissions:
  contents: write
concurrency:
  group: prepare-sync-20261102
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'Tr0sT/multica' && github.ref == 'refs/heads/sync/upstream-2026-11-02-84a15b5'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '~1.27.3'
          cache-dependency-path: server/go.sum
      - name: Resolve reviewed merge and exact collision sets
        shell: bash
        env:
          TARGET: 84a15b5fd073376217552a6e8b2cae3dc1879f9b
          FORK_BASE: e5e6bf8267337948ca1d37b6882dff03c10e7fc9
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/multica-ai/multica.git "$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET"
          git merge-base --is-ancestor "$FORK_BASE" HEAD
          git merge --no-ff --no-commit "$TARGET" || test "$(git diff --name-only --diff-filter=U)" = 'server/cmd/migrate/main.go'
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          p = Path('server/cmd/migrate/main.go')
          text = p.read_text()
          conflicts = list(re.finditer(r'^<<<<<<< HEAD\n(.*?)^=======\n(.*?)^>>>>>>> 84a15b5fd073376217552a6e8b2cae3dc1879f9b\n', text, re.M | re.S))
          assert len(conflicts) == 1, 'Unexpected conflict shape'
          m = conflicts[0]
          ours = re.findall(r'^\s*"([^"]+)":\s*"([^"]+)",\s*$', m[1], re.M)
          theirs = re.findall(r'^\s*"([^"]+)":\s*"([^"]+)",\s*$', m[2], re.M)
          assert {k for k, v in ours} == {'596_agent_marketplace_id_index', '597_agent_marketplace_source_index', '598_agent_marketplace_name_index', '599_agent_plugin_version_id_index', '600_agent_plugin_version_source_index', '601_agent_plugin_snapshot_context_index', '602_agent_marketplace_pending_index', '587_channel_reply_delivery_task_idx'}
          assert {k for k, v in theirs} == {'606_agent_task_queue_runtime_active_index', '604_wecom_install_session_begin_rate_idx', '603_wecom_install_session_agent_pending_idx', '602_wecom_install_session_request_idx', '601_wecom_install_session_due_idx'}
          assert not ({k for k, v in ours} & {k for k, v in theirs})
          p.write_text(text[:m.start()] + m[1] + m[2] + text[m.end():])
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert text.count(old) == 1, (path, old[:90], text.count(old))
              p.write_text(text.replace(old, new))
          p = Path('server/migrations/fork-prefix-allowlist.json')
          entries = json.loads(p.read_text())
          groups = {
              600: ['600_agent_plugin_version_source_index', '600_wecom_install_session'],
              601: ['601_agent_plugin_snapshot_context_index', '601_wecom_install_session_due_idx'],
              602: ['602_agent_marketplace_pending_index', '602_wecom_install_session_request_idx'],
          }
          for number, versions in groups.items():
              assert not any(e['prefix'] == number for e in entries)
              for version in versions:
                  for direction in ('up', 'down'):
                      file = Path('server/migrations', version + '.' + direction + '.sql')
                      assert file.is_file(), file
                      print(str(file), file.read_text())
              entries.append({'prefix': number, 'versions': versions, 'reason': 'Independently published fork marketplace/plugin indexes and upstream WeCom install-session objects. Distinct tables; preserve full identities and concurrent-index hooks. Upgrade coverage: TestForkMarketplaceAndUnreadPrefixCollisionsUpgrade (fresh, fork, upstream, repeated apply, rollback/reapply).'})
          p.write_text(json.dumps(entries, indent=2) + '\n')
          path = 'server/cmd/migrate/fork_prefix_marketplace_upgrade_test.go'
          replace(path, '// Keep fork marketplace migrations 595-599 and upstream sidebar/unread\n// migrations 595-599 independent even when one side was installed first.', '// Keep fork marketplace migrations 595-602 and upstream sidebar/unread/WeCom\n// migrations 595-602 independent even when one side was installed first.')
          replace(path, '\t\t"599_agent_plugin_version_id_index",\n', '\t\t"599_agent_plugin_version_id_index",\n\t\t"600_agent_plugin_version_source_index",\n\t\t"601_agent_plugin_snapshot_context_index",\n\t\t"602_agent_marketplace_pending_index",\n')
          replace(path, '\t\t"599_issue_unread_primary_key",\n', '\t\t"599_issue_unread_primary_key",\n\t\t"600_wecom_install_session",\n\t\t"601_wecom_install_session_due_idx",\n\t\t"602_wecom_install_session_request_idx",\n')
          replace(path, '\t\t\t\t"issue_unread_pkey",\n', '\t\t\t\t"agent_plugin_version_source_idx", "agent_plugin_snapshot_context_idx", "agent_marketplace_pending_idx",\n\t\t\t\t"issue_unread_pkey", "idx_wecom_install_session_due", "idx_wecom_install_session_request",\n')
          replace(path, 'range indexes[:4]', 'range indexes[:7]')
          replace(path, '\t\t\t\tpreviousIndexOIDs["issue_unread_pkey"] = oid("issue_unread_pkey")\n', '\t\t\t\tfor _, index := range indexes[7:] {\n\t\t\t\t\tpreviousIndexOIDs[index] = oid(index)\n\t\t\t\t}\n')
          replace(path, '\t\t\tbefore := history()\n', '''			if source == "fork" {
                      if _, err := pool.Exec(ctx, `INSERT INTO agent_plugin_snapshot
                          (workspace_id, agent_id, context_key, configured)
                          VALUES ('00000000-0000-4000-8000-000000000013',
                          '00000000-0000-4000-8000-000000000011', 'synthetic-chat', true)`); err != nil {
                          t.Fatal(err)
                      }
                  }
                  if source == "upstream" {
                      if _, err := pool.Exec(ctx, `INSERT INTO wecom_install_session
                          (request_key_hash, workspace_id, agent_id, initiator_user_id, status, scode_encrypted)
                          VALUES ('synthetic-request', '00000000-0000-4000-8000-000000000013',
                          '00000000-0000-4000-8000-000000000011',
                          '00000000-0000-4000-8000-000000000017', 'pending', 'synthetic-ciphertext')`); err != nil {
                          t.Fatal(err)
                      }
                  }
          			before := history()
          ''')
          replace(path, '\t\t\tif source == "fresh" {\n', '''			if source == "fork" {
                      var configured bool
                      if err := pool.QueryRow(ctx, "SELECT configured FROM agent_plugin_snapshot WHERE context_key = 'synthetic-chat'").Scan(&configured); err != nil || !configured {
                          t.Fatalf("lost existing plugin snapshot: configured=%t, error=%v", configured, err)
                      }
                  }
                  if source == "upstream" {
                      var status, ciphertext string
                      if err := pool.QueryRow(ctx, "SELECT status, scode_encrypted FROM wecom_install_session WHERE request_key_hash = 'synthetic-request'").Scan(&status, &ciphertext); err != nil || status != "pending" || ciphertext != "synthetic-ciphertext" {
                          t.Fatalf("WeCom install-session data was not preserved: %v", err)
                      }
                  }
          			if source == "fresh" {
          ''')
          replace('server/migrations/FORK-MIGRATIONS.md', '  595-599, ten SQL files, real runner, isolated PostgreSQL schemas. Marketplace\n  indexes and sidebar/unread objects remain independent;', '  595-602, sixteen SQL files, real runner, isolated PostgreSQL schemas. Marketplace\n  indexes and sidebar/unread/WeCom install-session objects remain independent;')
          PY
          gofmt -w server/cmd/migrate/main.go server/cmd/migrate/fork_prefix_marketplace_upgrade_test.go
          git add server/cmd/migrate/main.go server/cmd/migrate/fork_prefix_marketplace_upgrade_test.go server/migrations/fork-prefix-allowlist.json server/migrations/FORK-MIGRATIONS.md
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          (cd server && go test ./internal/migrations -count=1)
          git commit -m 'chore: merge upstream 84a15b5 and preserve reviewed migration identities'
          git merge-base --is-ancestor "$TARGET" HEAD
          git merge-base --is-ancestor "$FORK_BASE" HEAD
          git push origin HEAD:refs/heads/sync/upstream-2026-11-02-84a15b5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        with:
          name: nuclearband
          skipPush: true
      - name: Compute and verify the new pnpm dependency hash
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('nix/packages/multica-web.nix')
          text = p.read_text()
          old = 'hash = "sha256-LRAU0J4KzcFb6L8B7hvwaSPhs51BW6kKJWpbWvyeyFA=";'
          assert text.count(old) == 1
          p.write_text(text.replace(old, 'hash = lib.fakeHash;'))
          PY
          git add nix/packages/multica-web.nix
          if nix build --no-link --print-build-logs .#multica-web.pnpmDeps > "$RUNNER_TEMP/pnpm-hash.log" 2>&1; then
            echo 'Expected a fixed-output mismatch for fakeHash'; exit 1
          fi
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP'], 'pnpm-hash.log').read_text()
          hashes = re.findall(r'got:\s+(sha256-[A-Za-z0-9+/=]+)', log)
          if len(set(hashes)) != 1:
              print(log[-12000:])
              raise SystemExit('No unique actual pnpm hash; no hash change committed')
          actual = hashes[0]
          p = Path('nix/packages/multica-web.nix')
          text = p.read_text()
          assert text.count('hash = lib.fakeHash;') == 1
          p.write_text(text.replace('hash = lib.fakeHash;', 'hash = "' + actual + '";'))
          print('Actual pnpm dependency hash:', actual)
          PY
          git add nix/packages/multica-web.nix
          nix build --no-link --print-build-logs .#multica-web.pnpmDeps
          git diff --cached --check
          git commit -m 'build(nix): refresh pnpm hash after upstream dependency updates'
          git push origin HEAD:refs/heads/sync/upstream-2026-11-02-84a15b5
