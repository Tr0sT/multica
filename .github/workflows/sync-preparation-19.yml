name: PR 19 verified sync reconstruction

on:
  push:
    branches:
      - sync/upstream-2026-11-12-191e84be

permissions:
  contents: write

concurrency:
  group: pr19-verified-reconstruction
  cancel-in-progress: false

jobs:
  reconstruct:
    if: github.repository == 'Tr0sT/multica' && github.ref == 'refs/heads/sync/upstream-2026-11-12-191e84be' && github.actor == 'Tr0sT'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORK_SHA: 0a8b72e12cf56e6d3263504b2b173e2154c115b1
      UPSTREAM_SHA: c3a9d8fd1e460f9cf79be7160f19cd1a12624332
      EXPECTED_TREE: 1ef5655a01e34b64ff933dbb3fc7e301bbc6428b
      SYNC_BRANCH: sync/upstream-2026-11-12-191e84be
    steps:
      - name: Checkout the exact staging revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Configure the declared Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '~1.27.4'
          check-latest: true
          cache: false
      - name: Reconstruct the reviewed tree in an isolated worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$FORK_SHA"
          test "$(git ls-remote origin "refs/heads/$SYNC_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.hooksPath /dev/null
          git config merge.conflictStyle merge
          git fetch --no-tags https://github.com/multica-ai/multica.git "$UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"
          git update-ref refs/remotes/review/upstream "$UPSTREAM_SHA"
          git worktree add --detach "$RUNNER_TEMP/combined" "$FORK_SHA"
          status=0
          git -C "$RUNNER_TEMP/combined" merge --no-ff --no-commit refs/remotes/review/upstream || status=$?
          test "$status" -le 1
          python3 "$GITHUB_WORKSPACE/.github/sync-resolution-19.py" "$RUNNER_TEMP/combined"
          test "$(git -C "$RUNNER_TEMP/combined" write-tree)" = "$EXPECTED_TREE"
          git -C "$RUNNER_TEMP/combined" commit -m "Merge upstream main c3a9d8fd into fork with reviewed conflict resolutions"
          combined=$(git -C "$RUNNER_TEMP/combined" rev-parse HEAD)
          git merge-base --is-ancestor "$FORK_SHA" "$combined"
          git merge-base --is-ancestor "$UPSTREAM_SHA" "$combined"
          git merge --no-ff --no-commit "$combined"
          git rm .github/workflows/sync-preparation-19.yml .github/sync-resolution-19.py
          git diff --cached --check
          test -z "$(git ls-files -u)"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git commit -m "chore(sync): integrate verified fork and upstream history for PR 19"
          git merge-base --is-ancestor "$FORK_SHA" HEAD
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
      - name: Publish only a fast-forward of the existing sync branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$FORK_SHA"
          test "$(git ls-remote origin "refs/heads/$SYNC_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$SYNC_BRANCH"
          {
            printf 'fork=%s\nupstream=%s\nhead=%s\ntree=%s\n' "$FORK_SHA" "$UPSTREAM_SHA" "$(git rev-parse HEAD)" "$EXPECTED_TREE"
            printf 'This is reconstruction only. Required CI must pass before main can be merged.\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"
