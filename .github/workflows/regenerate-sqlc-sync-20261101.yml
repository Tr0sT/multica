name: Regenerate sqlc for fork sync 2026-11-01 (temporary)
on:
  push:
    branches:
      - sync/upstream-2026-11-01
    paths:
      - .github/workflows/regenerate-sqlc-sync-20261101.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'Tr0sT/multica'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '~1.27.3'
          check-latest: true
          cache-dependency-path: server/go.sum
      - name: Regenerate generated SQL after semantically merging independent cleanups
        run: |
          set -euo pipefail
          git config user.name "Multica Fork Sync"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          make sqlc
          grep -q 'cleared_agent_plugin_snapshots AS' server/pkg/db/generated/issue.sql.go
          grep -q 'cleared_unread AS' server/pkg/db/generated/issue.sql.go
          grep -q 'WebhookDeliveryID' server/pkg/db/generated/issue.sql.go
          git diff --check
          git add server/pkg/db/generated
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit -m "fix(sql): regenerate sqlc for combined upstream and fork queries"
          fi
          git rm .github/workflows/regenerate-sqlc-sync-20261101.yml
          git commit -m "chore: remove temporary sqlc regeneration workflow"
          git push origin HEAD:refs/heads/sync/upstream-2026-11-01
