name: Temporary upstream sync preparation 2026-11-11

on:
  push:
    branches:
      - sync/upstream-2026-11-11-079ec9f6

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'Tr0sT/multica'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge exactly pinned upstream commit in isolated runner
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_FORK=31e5f2cf7b3c60c0a7550f552b17cfa0916420e5
          TARGET=079ec9f676ffccc8df20b43d96bda62dd86169f4
          test "$(git rev-parse HEAD^)" = "$EXPECTED_FORK"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_FORK"
          git remote add upstream https://github.com/multica-ai/multica.git
          git fetch --no-tags upstream "$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET"
          if ! git -c user.name='Multica Sync Bot' -c user.email='sync-bot@users.noreply.github.com' merge --no-ff --no-commit FETCH_HEAD; then
            echo "GIT MERGE CONFLICTS (no commit/push performed):"
            git diff --name-only --diff-filter=U
            for file in $(git diff --name-only --diff-filter=U | grep -v '[[:space:]]'); do
              echo "::group::Conflict markers in $file"
              grep -nE '^(<<<<<<<|=======|>>>>>>>)' "$file" || true
              echo "::endgroup::"
            done
            exit 4
          fi
          # Leave workflow changes for an explicit connector review, because
          # the ephemeral GITHUB_TOKEN cannot safely update workflow files.
          git restore --source=HEAD --staged --worktree -- .github/workflows
          echo "DIFF SUMMARY ON COMBINED TREE:"
          git diff --cached --stat | tail -n 50
          git -c user.name='Multica Sync Bot' -c user.email='sync-bot@users.noreply.github.com' commit -m 'chore(sync): merge multica upstream 079ec9f6 (pinned)'
          echo "MERGE_COMMIT=$(git rev-parse HEAD)"
          echo "PARENTS=$(git show -s --pretty='%P' HEAD)"
          git push origin HEAD:refs/heads/sync/upstream-2026-11-11-079ec9f6
