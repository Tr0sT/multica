name: Prepare pinned upstream integration 2026-11-05
on:
  push:
    branches: [sync/upstream-2026-11-05-3a0fed5]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Merge immutable upstream SHA into fork (do not modify main)
        shell: bash
        env:
          TARGET: 3a0fed59f52b600ebbce1117b65c87f7d13ca492
          BASE: f528bea4421c542e54b7fbd0663857f6eabfbfd2
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/multica-ai/multica.git "$TARGET"
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET"
          git merge-base --is-ancestor "$BASE" HEAD
          if ! git merge --no-ff --no-commit "$TARGET"; then
            echo 'Resolve four reviewed, isolated conflicts while preserving both features'
            python3 - <<'PY'
          from pathlib import Path
          import subprocess

          paths = [
              "packages/views/chat/chat-page.tsx",
              "packages/views/chat/components/chat-thread-list.test.tsx",
              "packages/views/chat/components/chat-thread-list.tsx",
              "server/cmd/migrate/main.go",
          ]
          conflicts = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=U"], text=True
          ).splitlines()
          assert sorted(conflicts) == sorted(paths), f"Unexpected conflicts: {conflicts}"

          def stage(n, name):
              return subprocess.check_output(["git", "show", f":{n}:{name}"], text=True)

          page = stage(2, paths[0])
          assert page.count('<div className="px-2 py-1">') == 1
          page = page.replace('<div className="px-2 py-1">', '<div className="min-h-0 flex-1 px-2 py-1">', 1)
          Path(paths[0]).write_text(page)

          fork_test = stage(2, paths[1])
          upstream_test = stage(3, paths[1])
          beginning = 'it("names Mattermost participants and hides mutation actions for another member\'s chat", () => {'
          end_marker = '\ndescribe("ChatThreadList archive delegation"'
          assert beginning in fork_test and end_marker in fork_test
          custom = fork_test[fork_test.index(beginning):fork_test.index(end_marker)]
          assert custom.count('  render(\n    <I18nProvider') == 1
          custom = custom.replace(
              '  render(\n    <I18nProvider',
              '  render(\n    <VirtuosoMockContext.Provider value={{ viewportHeight: 560, itemHeight: 56 }}>\n    <I18nProvider', 1,
          )
          custom = custom.replace(
              '    </I18nProvider>,\n  );',
              '    </I18nProvider>\n    </VirtuosoMockContext.Provider>,\n  );', 1,
          )
          test_anchor = 'describe("ChatThreadList windowing", () => {'
          assert upstream_test.count(test_anchor) == 1
          Path(paths[1]).write_text(upstream_test.replace(test_anchor, custom + test_anchor, 1))

          thread = stage(2, paths[2])
          upstream_thread = stage(3, paths[2])
          assert thread.count('import { chatChannelLabel } from "../lib/channel-label";') == 1
          thread = thread.replace(
              'import { chatChannelLabel } from "../lib/channel-label";',
              'import { chatChannelLabel } from "../lib/channel-label";\nimport { SessionHistoryList } from "./session-history-list";', 1,
          )
          head = '  // Archived view: a back header, then the archived rows.'
          tail = '}\n\nfunction RowAction({'
          for source in (thread, upstream_thread):
              assert source.count(head) == 1 and source.count(tail) == 1
          thread = thread[:thread.index(head)] + upstream_thread[
              upstream_thread.index(head):upstream_thread.index(tail)
          ] + thread[thread.index(tail):]
          assert "viewerId" in thread and "chatChannelLabel(session)" in thread
          assert "rowActions.length > 0" in thread and "SessionHistoryList sessions" in thread
          Path(paths[2]).write_text(thread)

          migrate = stage(2, paths[3])
          assert migrate.count('  var concurrentIndexCleanups = map[string]string{') == 1
          upstream_migrate = stage(3, paths[3])
          assert '"613_skill_version_index"' in upstream_migrate
          assert '"613_skill_version_index"' not in migrate
          migrate = migrate.replace(
              '  var concurrentIndexCleanups = map[string]string{',
              '  var concurrentIndexCleanups = map[string]string{\n\t"613_skill_version_index": "idx_skill_version_skill_version",', 1,
          )
          Path(paths[3]).write_text(migrate)
          PY
            gofmt -w server/cmd/migrate/main.go
            git add packages/views/chat/chat-page.tsx packages/views/chat/components/chat-thread-list.test.tsx packages/views/chat/components/chat-thread-list.tsx server/cmd/migrate/main.go
            remaining="$(git diff --name-only --diff-filter=U)"
            test -z "$remaining" || { echo "Unresolved conflicts: $remaining"; exit 1; }
          fi
          git diff --cached --check
          git commit -m "chore(sync): merge upstream main 3a0fed5 (2026-11-05)"
          git merge-base --is-ancestor "$TARGET" HEAD
          git rm .github/workflows/prepare-sync-20261105.yml
          git commit -m "chore: remove temporary sync preparation workflow"
          git diff "$BASE" HEAD --check
          echo "Combined head $(git rev-parse HEAD)"
          echo "Upstream ancestor: $(git merge-base --is-ancestor "$TARGET" HEAD && echo yes)"
          git push origin HEAD:refs/heads/sync/upstream-2026-11-05-3a0fed5
