name: Prepare upstream sync 2026-11-06
on:
  push:
    branches:
      - sync/upstream-2026-11-06-61e7e8f
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'Tr0sT/multica'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Merge reviewed pinned upstream into isolated PR branch
        shell: bash
        env:
          UPSTREAM_SHA: 61e7e8f966f53478f3efe68ec50c5a5fdd00a51f
          FORK_BASE: 66022d9267585cf683fab89967be19ad4e2fa3ea
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge-base --is-ancestor "$FORK_BASE" HEAD
          git fetch --no-tags https://github.com/multica-ai/multica.git "$UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"
          if ! git merge --no-ff --no-commit "$UPSTREAM_SHA"; then
            echo "MERGE CONFLICT: no changes pushed"
            git diff --name-only --diff-filter=U
            git diff --cc | head -n 300 || :
            exit 1
          fi
          # The preparation workflow must not persist in the resulting PR tree.
          git rm -f .github/workflows/prepare-sync-20261106.yml
          git diff --cached --check
          git commit -m 'chore: merge upstream main at 61e7e8f while preserving fork'
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD
          git merge-base --is-ancestor "$FORK_BASE" HEAD
          git status --short
          git push origin HEAD:refs/heads/sync/upstream-2026-11-06-61e7e8f
