name: Repair sync import
on:
  push:
    branches: ['sync/upstream-2026-11-02-84a15b5']
    paths: [.github/workflows/repair-sync-import.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'Tr0sT/multica' && github.ref == 'refs/heads/sync/upstream-2026-11-02-84a15b5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Keep one import of the same re-exported helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/core/api/client.test.ts')
          text = p.read_text()
          direct = 'import { setCurrentWorkspace } from "../platform/workspace-storage";\n'
          public = 'import { setCurrentWorkspace } from "../platform";\n'
          assert text.count(direct) == 1 and text.count(public) == 1
          p.write_text(text.replace(direct, ''))
          PY
          git diff --check
          git diff -- packages/core/api/client.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/core/api/client.test.ts
          git commit -m 'fix(core): deduplicate workspace helper import after upstream merge'
          git push origin HEAD:refs/heads/sync/upstream-2026-11-02-84a15b5
