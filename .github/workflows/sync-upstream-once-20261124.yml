name: Temporary websocket security update
on:
  push:
    branches: [sync-worker/upstream-20261124-6368504e]
permissions:
  contents: read
jobs:
  fix:
    if: github.repository == 'Tr0sT/multica'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 5af0a8bc31c42d711d01687d508251e7933aa63a
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '~1.27.4'
          cache: false
      - uses: cachix/install-nix-action@v31
      - name: Update affected websocket dependency and calculate vendor hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5af0a8bc31c42d711d01687d508251e7933aa63a"
          (cd server && go get github.com/gorilla/websocket@v1.5.4-0.20240701034025-d67f41855da4 && go mod tidy)
          git diff -- server/go.mod server/go.sum
          sed -i 's@vendorHash = "sha256-[^"]*";@vendorHash = lib.fakeHash;@' nix/packages/multica-{cli,server}.nix
          for pkg in cli server; do
            log="$(mktemp)"
            if nix build ".#multica-$pkg" --no-link --print-build-logs >"$log" 2>&1; then
              echo "Unexpected fake hash success"; exit 1
            fi
            tail -n 40 "$log"
            hash="$(sed -n 's/.*got:[[:space:]]*\(sha256-[A-Za-z0-9+/=]*\).*/\1/p' "$log" | sort -u)"
            test "$(printf '%s\n' "$hash" | wc -l)" -eq 1
            [[ "$hash" =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]]
            sed -i "s@vendorHash = lib.fakeHash;@vendorHash = \"$hash\";@" "nix/packages/multica-$pkg.nix"
          done
          git diff --check
          git diff -- server/go.mod server/go.sum nix/packages/multica-cli.nix nix/packages/multica-server.nix
          echo FIX_DIFF_COMPLETE
      - name: Verify updated dependency and native packages
        run: |
          set -euo pipefail
          (cd server && go tool govulncheck ./...)
          nix build .#multica-cli .#multica-server --no-link --print-build-logs
