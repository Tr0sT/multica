                'week': '最近 7 天',
                'month': '最近 30 天',
                'sixty_days': '最近 60 天',
                'ninety_days': '最近 90 天',
                'year': '最近 1 年',
                'unlimited': '不限',
                'channel_unlimited_summary': '對話歷史，不限日期',
                'help': '控制從 Mattermost 載入的歷史訊息。現有的 Multica 對話會保留。',
                'notice': '其他參與者的訊息會儲存在 Multica，並傳送給智慧體使用的模型。上限為 1,000 則訊息／128 KiB；歷史訊息不完整時會標示。',
                'summary': '上下文：{{selection}}',
                'channel_summary': '最近 {{hours}} 小時的對話歷史'
              },
              'section_title': 'Mattermost',
              'page_description': '將每個 Multica 智慧體連接至自架伺服器上的獨立 Mattermost 機器人。成員可以私訊機器人、在頻道中 @提及它，或輸入 /issue 建立 Multica 任務，並在同一討論串收到智慧體的回覆。',
              'not_enabled_title': '尚未啟用 Mattermost 整合',
              'not_enabled_description_prefix': '在伺服器設定',
              'not_enabled_description_suffix': '即可啟用 Mattermost 機器人安裝。',
              'not_enabled_self_host_hint': '自架部署詳情請參閱專案 README。',
              'preview_title': 'Mattermost 安裝功能即將開放',
              'preview_description': '已設定靜態加密金鑰，但此部署尚未開放安裝。開放後，這裡會顯示連接按鈕。',
              'connected_bots': '已連接的機器人',
              'loading': '載入中...',
              'load_failed': '無法載入 Mattermost 安裝項目',
              'empty_title': '尚未連接機器人',
              'empty_description_prefix': '開啟此工作區的智慧體，然後點選',
              'empty_description_cta': '連接 Mattermost',
              'empty_description_suffix': '，為它安裝機器人。',
              'revoked_badge': '已撤銷',
              'installed_at_label': '安裝於 {{when}}',
              'disconnect': '中斷連接',
              'disconnecting': '正在中斷連接...',
              'disconnect_confirm_title': '中斷此 Mattermost 機器人的連接？',
              'disconnect_confirm_description': '機器人將停止接收此工作區的 Mattermost 訊息。Multica 中的對話歷史會保留；之後可以從同一個智慧體重新連接。',
              'disconnect_confirm_cancel': '取消',
              'toast_disconnected': '已中斷 Mattermost 機器人的連接',
              'toast_disconnect_failed': '無法中斷連接',
