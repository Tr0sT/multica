              'read_only': '你正在檢視另一位成員的對話。只有對話擁有者可以傳送訊息或修改對話。',
              'visibility': '你和工作區管理員可以檢視此對話。'
            }},
            'agents': {'tab_body': {'skills': {'runtime_overridden_badge': '已由指派的 skill 覆寫'}}},
            'settings': {'mattermost': {
