              'error_unknown': '發生錯誤。請重試；如果問題持續出現，請聯絡工作區管理員。',
              'loading': '正在檢查帳號...',
              'confirm_description': '將 {{server}} 上的 @{{username}} 關聯至工作區 {{workspace}} 中的 {{account}}？',
              'confirm_warning': '只有在這是你的 Mattermost 帳號，且你主動要求建立此連結時才繼續。控制該帳號的人可以在此工作區以你的身分操作。',
              'confirm': '關聯帳號',
              'cancel': '取消'
            }},
            'chat': {'owner_filter': {
              'label': '對話擁有者',
              'mine': '我的對話',
