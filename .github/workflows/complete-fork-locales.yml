              'agent_bot_manage_link': '開啟 Mattermost',
              'agent_bot_manage_tooltip': '在瀏覽器中開啟此 Mattermost 伺服器。',
              'connect_dialog_title': '連接 Mattermost 機器人',
              'connect_dialog_description': '在 Mattermost 系統控制台建立機器人帳號並產生存取 token，然後在下方貼上伺服器 URL 和 token。兩者都會即時驗證，token 會加密儲存。',
              'connect_docs_link': '逐步教學：將 Multica 智慧體連接至 Mattermost',
              'server_url_label': '伺服器 URL',
              'access_token_label': '機器人存取 token',
              'connect_submit': '連接',
              'connect_submitting': '連接中...',
              'connect_cancel': '取消',
              'connect_success_toast': '已連接 Mattermost 機器人',
              'connect_failed_toast': '無法連接 Mattermost 機器人',
              'not_enabled_description': '請 Multica 管理員啟用 Mattermost，並核准伺服器的 HTTPS URL。',
              'denied_reply': {
                'label': '回覆名單外的帳號',
                'text': '文字',
                'image': '隨機圖片',
                'help': '自動傳送，不啟動智慧體，也不消耗智慧體的 token 用量。',
                'text_label': '回覆文字',
                'text_help': '最多 4000 個字元。留空則使用預設的存取遭拒訊息。',
                'image_label': '回覆圖片',
                'image_help': '支援 PNG、JPEG、GIF 或 WebP，每張最多 5 MiB。每次回覆會隨機選一張圖片，可能重複。',
                'preview': '自動回覆圖片預覽',
                'preview_failed': '無法載入已儲存的圖片，請重新上傳。',
                'unknown': '未知的回覆類型',
                'remove_image': '移除 {{name}}'
              },
              'access': {
                'label': '誰可以使用此機器人',
                'members': '已關聯的 Multica 工作區成員',
                'anyone': '任何 Mattermost 使用者',
                'allowlist': '指定的 Mattermost 帳號',
                'users_label': '允許的 Mattermost 使用者名稱',
                'users_help': '最多輸入 100 個 @使用者名稱，以逗號或換行分隔。名單為空時，所有人都無法存取。帳號變更使用者名稱後仍保有存取權。',
                'unknown': '未知的存取模式',
                'notice': '不需要 Multica 帳號。請求會以機器人安裝者的身分執行，並可使用智慧體的工具和已連接的應用程式。',
                'summary': '存取權：{{selection}}'
              },
              'attachments': {
                'label': '傳送給智慧體的附件',
                'links': '傳送連結',
                'none': '不傳送',
                'unknown': '未知的附件設定',
                'help': '目前訊息和所選歷史訊息只會傳送檔名、類型、大小和連結。檔案會在需要時下載。連結有效期為 24 小時，請勿公開。'
              }
            }}
          }
          def leaves(value, prefix=()):
              if isinstance(value, dict):
                  return {p: v for k, child in value.items() for p, v in leaves(child, prefix+(k,)).items()}
              return {prefix: value}
          for namespace, patch in additions.items():
              path = Path('packages/views/locales/zh-Hant', namespace+'.json')
              original = json.loads(path.read_text())
              before = leaves(original)
              english = leaves(json.loads(Path('packages/views/locales/en', namespace+'.json').read_text()))
              count = 0
              for key, value in leaves(patch).items():
                  assert key in english, (namespace, key)
                  assert sorted(re.findall(r'\{\{[^}]+\}\}', value)) == sorted(re.findall(r'\{\{[^}]+\}\}', english[key])), (namespace, key, 'placeholders')
                  if key in before:
                      continue
                  target = original
                  for component in key[:-1]:
                      target = target.setdefault(component, {})
                  target[key[-1]] = value
                  count += 1
              after = leaves(original)
              assert all(after[key] == value for key, value in before.items())
              path.write_text(json.dumps(original, ensure_ascii=False, indent=2)+'\n')
              print(namespace, 'added translations:', count)
          PY
          gofmt -w server/internal/migrations/fork_prefix_allowlist_test.go server/internal/migrations/fork_version_identity_test.go server/internal/migrations/migrations_lint_test.go server/cmd/migrate/fork_prefix_upgrade_test.go
          git diff --check
      - name: Check migration lint and compile upgrade regression
        working-directory: server
        run: |
          go test -race ./internal/migrations -count=1
          go test ./cmd/migrate -run '^$'
      - name: Publish only reviewed source additions to the sync branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/views/locales/zh-Hant/common.json packages/views/locales/zh-Hant/settings.json packages/views/locales/zh-Hant/agents.json packages/views/locales/zh-Hant/chat.json server/internal/migrations/fork_prefix_allowlist_test.go server/internal/migrations/fork_version_identity_test.go server/internal/migrations/migrations_lint_test.go server/cmd/migrate/fork_prefix_upgrade_test.go
          git diff --cached --stat
          git commit -m 'fix(i18n): complete Traditional Chinese copy for fork features'
          git push origin HEAD:refs/heads/sync/upstream-2026-10-30
