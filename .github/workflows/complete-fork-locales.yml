name: Complete fork locale additions
on:
  push:
    branches: ['sync/upstream-2026-10-30']
    paths: ['.github/workflows/complete-fork-locales.yml']
permissions:
  contents: write
concurrency:
  group: complete-fork-locales
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'Tr0sT/multica' && github.ref == 'refs/heads/sync/upstream-2026-10-30'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '~1.27.3'
          cache-dependency-path: server/go.sum
      - name: Add reviewed translations without replacing existing keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          additions = {
            'common': {'mattermost_bind': {
              'page_title': '關聯 Mattermost 帳號',
              'redeeming': '正在關聯帳號...',
