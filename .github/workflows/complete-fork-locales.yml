              'edit_success_toast': '已儲存 Mattermost 設定',
              'edit_failed_toast': '無法更新 Mattermost 設定',
              'context': {
                'label': '傳送給智慧體的歷史訊息',
                'message': '僅目前訊息',
                'thread': '完整討論串',
